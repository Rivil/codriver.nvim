# mise — development environment for codriver.nvim
#
# Tool versions mirror coder/claudecode.nvim's mise.toml so that vendored code
# is built and checked by exactly the toolchain upstream uses (see VENDOR.md).
#
#   mise install       # provision all tools (builds Lua/LuaJIT from source)
#   mise run setup     # build the Lua test rocks (busted/luacheck/luacov)
#   mise run all       # format + lint + test
#
# Run `mise tasks` to list everything below.

[settings]
# Committed mise.lock pins resolved URLs + checksums for binary-download tools.
# Regenerate with: mise lock -p linux-x64,macos-arm64
lockfile = true

[tools]
# LuaJIT is the runtime Neovim embeds, and the test suite *requires* it: the
# blocking-diff tools yield coroutines across pcall/C-call boundaries, which
# PUC Lua 5.1 cannot do. busted/luacheck/luacov all run under LuaJIT.
luajit = "2.1.1744318430"
# PUC Lua is installed only for its bundled LuaRocks, which `mise run setup`
# uses to build the test rocks *targeting LuaJIT* (luarocks --lua-dir).
# (The LuaJIT plugin does not ship a LuaRocks.)
lua = "5.5.0"
# Neovim for the integration test suite and local plugin testing.
neovim = "0.12.3"

# Node provides the runtime for prettier (installed via the npm backend).
node = "26.3.0"

# treefmt drives every formatter/linter below.
"github:numtide/treefmt" = "2.5.0"
stylua = "2.5.2"
prettier = "3.8.4"
shfmt = "3.13.1"
shellcheck = "0.11.0"
actionlint = "1.7.12"
zizmor = "1.25.2"

# Type checking. A deliberate divergence from upstream, which does not use it:
# codriver's wrapper API (roles, review, dross binding) is annotation-heavy and
# those annotations are worth enforcing rather than trusting. Scoped to
# lua/codriver only — see .luarc.json.
lua-language-server = "3.18.2"

[env]
# Lua test rocks (busted/luacheck/luacov) live in a project-local tree that
# `mise run setup` populates.
_.path = [".luarocks/bin"]
# Resolve the plugin's modules, test helpers, and the rock tree from any CWD
# when running busted/luacheck/luajit directly.
LUA_PATH = "{{config_root}}/?.lua;{{config_root}}/?/init.lua;{{config_root}}/lua/?.lua;{{config_root}}/lua/?/init.lua;{{config_root}}/.luarocks/share/lua/5.1/?.lua;{{config_root}}/.luarocks/share/lua/5.1/?/init.lua;;"
LUA_CPATH = "{{config_root}}/.luarocks/lib/lua/5.1/?.so;;"

[tasks.setup]
description = "Build the Lua test rocks (busted/luacheck/luacov) for LuaJIT into ./.luarocks"
run = '''
set -eu
if [ -x .luarocks/bin/busted ] && [ -x .luarocks/bin/luacheck ] && [ -x .luarocks/bin/luacov ]; then
  echo ".luarocks already populated (run 'rm -rf .luarocks && mise run setup' to rebuild)"
  exit 0
fi
LUAJIT_PREFIX="$(mise where luajit)"
TREE="$PWD/.luarocks"
echo "Building Lua test rocks for LuaJIT into $TREE ..."
for rock in "busted 2.2.0" "luacheck 1.2.0" "luacov 0.16.0"; do
  ok=0
  for attempt in 1 2 3; do
    # shellcheck disable=SC2086
    if luarocks --lua-dir "$LUAJIT_PREFIX" --lua-version 5.1 install --tree "$TREE" $rock; then
      ok=1
      break
    fi
    echo ">> luarocks install '$rock' failed (attempt $attempt/3)" >&2
    if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
  done
  [ "$ok" = 1 ] || { echo "ERROR: could not install $rock" >&2; exit 1; }
done
'''

[tasks.check]
description = "Check Lua syntax and run luacheck"
depends = ["setup"]
run = '''
echo "Checking Lua files for syntax errors..."
# Vendored code is parsed too — a broken require-rewrite must fail loudly here.
# Pipe into xargs so a failed loadfile propagates a non-zero exit on BSD find
# (macOS) too — `find -exec ... \;` swallows the child's status there.
find lua -name "*.lua" -type f -print0 | xargs -0 -I{} luajit -e "assert(loadfile('{}'))"
echo "Running luacheck..."
# lua/codriver/vendor is excluded in .luacheckrc — it is upstream's to lint.
./.luarocks/bin/luacheck lua/ tests/ --no-unused-args --no-max-line-length
'''

[tasks.test]
description = "Run the full test suite (busted units + headless-Neovim vendor smoke)"
depends = ["setup"]
run = '''
set -eu
echo "Running all tests..."
TEST_FILES=$(find tests -type f -name "*_test.lua" -o -name "*_spec.lua" | sort)
echo "Found test files:"
echo "$TEST_FILES"
if [ -n "$TEST_FILES" ]; then
  ./.luarocks/bin/busted --coverage -v $TEST_FILES
else
  echo "No test files found"
fi
mise run test-nvim
'''

[tasks.typecheck]
description = "Type-check the wrapper modules with lua-language-server (vendor excluded)"
run = '''
set -eu
OUT="$(mktemp -d)"
trap 'rm -rf "$OUT"' EXIT
# --check wants an absolute path, and writes its report as JSON rather than
# using the exit code — a clean run produces no check.json at all.
lua-language-server --check "$PWD/lua/codriver" --checklevel=Warning --logpath="$OUT" --configpath="$PWD/.luarc.json"
if [ -s "$OUT/check.json" ] && [ "$(tr -d '[:space:]' <"$OUT/check.json")" != "{}" ]; then
  echo "typecheck: diagnostics found" >&2
  cat "$OUT/check.json" >&2
  exit 1
fi
echo "typecheck: no diagnostics"
'''

[tasks."test-nvim"]
description = "Load every vendored module in real Neovim (proves the require-rewrite resolves)"
run = "nvim --clean --headless -l tests/nvim/vendor_smoke.lua"

[tasks.format]
description = "Format the whole tree with treefmt"
run = "treefmt"

[tasks.format-check]
description = "Verify formatting without writing (used in CI)"
run = "treefmt --ci"

[tasks."vendor-sync"]
description = "Re-vendor coder/claudecode.nvim (optionally at a new SHA)"
run = "./scripts/vendor-sync.sh"

[tasks.clean]
description = "Remove generated coverage files"
run = '''
rm -f luacov.report.out luacov.stats.out
rm -f tests/lcov.info
'''

[tasks.all]
description = "Format, lint, typecheck, and test (full validation)"
run = "mise run format && mise run check && mise run typecheck && mise run test"
