[[criterion]]
  id = "c-1"
  status = "covered"
  tests = ["tests/nvim/dross_untracked_notify_check.lua"]
  notes = "start_command (lua/codriver/init.lua:92-94) WARNs once via dross.read().available when no phase is active. Real-nvim check drives :CodriverStart against a scratch cwd with no .dross/ (exactly one WARN mentioning \"untracked\", start does not raise) and with an active phase in state.json (zero untracked notifications)."

[[criterion]]
  id = "c-2"
  status = "covered"
  tests = ["tests/codriver/tasks_spec.lua:it('lists id, title, status and owner for each task')", "tests/nvim/tasks_check.lua"]
  notes = ":CodriverTasks (lua/codriver/tasks.lua M.render/M.open) formats id/status/title/owner per task with no shell-out to dross. tasks_spec.lua proves the formatting against fakes; tasks_check.lua opens a real buffer and asserts the rendered lines contain id, title and status."

[[criterion]]
  id = "c-3"
  status = "covered"
  tests = ["tests/codriver/ownership_spec.lua", "tests/codriver/tasks_spec.lua:it('lists id, title, status and owner for each task')", "tests/nvim/tasks_check.lua"]
  notes = "ownership.lua's claim/owner semantics (per-phase keying, human default) are unit-tested directly; tasks.lua's render() calls ownership.owner() per task and both the fake-backed spec and the real-buffer nvim check assert the owner column (claude vs human) appears in the rendered line."

[[criterion]]
  id = "c-4"
  status = "covered"
  tests = ["tests/codriver/tasks_spec.lua:it('re-reads dross.read() on every call')"]
  notes = "Direct test: a fake dross.read() that changes its answer between calls is asserted to produce two different renders (call count == 2, first/second not equal), confirming no caching from session start."

[[criterion]]
  id = "c-5"
  status = "covered"
  tests = ["tests/codriver/dross_spec.lua", "tests/nvim/tasks_check.lua", "tests/nvim/dross_untracked_notify_check.lua"]
  notes = "dross.read() returns a structured {available=false[, reason=\"corrupt\"]} instead of raising for missing state.json, no current_phase, and malformed plan.toml (dross_spec.lua, all pcall-wrapped where relevant). tasks_check.lua confirms open() notifies rather than opening a window or erroring on a corrupt plan.toml. dross_untracked_notify_check.lua confirms setup()+:CodriverStart do not raise with no .dross/ present at all."

[[finding]]
