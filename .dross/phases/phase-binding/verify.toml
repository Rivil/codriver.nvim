  text = ":CodriverClaim's own command handler (claim_command, lua/codriver/init.lua:155-174) has no test coverage of its own — no spec or nvim check ever invokes the command or the handler directly. Only the pure ownership.claim/owner/is_known helpers it calls are unit-tested. t-2's third test_contract line (\"CodriverClaim on a task id absent from dross.read()'s current task list still records the claim but triggers a WARN notify\") describes command-level behavior that remains unexercised, as does the \"no active dross phase — nothing to claim\" branch."

