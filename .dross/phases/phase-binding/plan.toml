task_seq = 0

[phase]
  id = "phase-binding"

[[task]]
  id = "t-1"
  wave = 1
  title = "dross reader: state.json + plan.toml task extractor"
  files = ["lua/codriver/dross.lua", "tests/codriver/dross_spec.lua"]
  description = "Reads .dross/state.json (current_phase, current_phase_status) and\n.dross/phases/<id>/plan.toml directly off disk, relative to vim.fn.getcwd().\nNo TOML library exists in this repo, so plan.toml parsing is a narrow\nfield-extractor scoped to exactly what the task surface needs: pulls\nid/title/status out of each [[task]] block, ignoring every other field\n(files, description, covers, test_contract, depends_on, wave). Missing\n.dross/, missing state.json, or malformed plan.toml all return a structured\n\"unavailable\" result rather than raising.\n"
  covers = ["c-1", "c-2", "c-5"]
  test_contract = ["if .dross/state.json is missing or unreadable, read() returns {available=false} instead of erroring", "if plan.toml exists but is malformed, read() returns {available=false, reason=\"corrupt\"} instead of erroring", "given a valid state.json + plan.toml fixture, read() returns the current phase id and a list of tasks with id/title/status extracted from each [[task]] block"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 2
  title = "Local ownership mapping + :CodriverClaim"
  files = ["lua/codriver/ownership.lua", "lua/codriver/init.lua", "tests/codriver/ownership_spec.lua", "tests/nvim/codriver_claim_check.lua"]
  description = "Codriver-local task-ownership store at .dross/.codriver-ownership.json\n(gitignored), keyed by (phase_id, task_id) so a task id claimed in one phase\nnever bleeds into another phase reusing the same id. :CodriverClaim <task-id>\nsets owner=claude for the current phase's task id; unclaimed defaults to\n\"human\". Validates the id against dross.read()'s current task list and\nvim.notify WARNs (but still records the claim) when the id isn't found.\n"
  covers = ["c-3"]
  depends_on = ["t-1"]
  test_contract = ["M.claim(phase_id, task_id) followed by M.owner(phase_id, task_id) returns \"claude\"; an id never claimed returns \"human\"", "claiming t-1 in phase A does not affect M.owner(\"phase-B\", \"t-1\")", ":CodriverClaim on a task id absent from dross.read()'s current task list still records the claim but triggers a WARN notify"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 2
  title = "Session-start untracked-phase notification"
  files = ["lua/codriver/init.lua", "tests/nvim/dross_untracked_notify_check.lua"]
  description = "Wired into init.lua's start_command (the :CodriverStart / auto_start path,\nper c-1's \"starting a session\" wording): calls dross.read() and, when no\nphase is active (missing .dross/, no current_phase, or an unavailable read),\nfires a single one-line WARN vim.notify indicating the session is running\nuntracked. Must not raise even when dross.read() reports unavailable (c-5).\n"
  covers = ["c-1", "c-5"]
  depends_on = ["t-1"]
  test_contract = ["starting a session with no .dross directory present fires exactly one WARN-level vim.notify mentioning the session is untracked, and start_command does not error", "starting a session with an active phase in state.json does not emit the untracked warning"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 3
  title = ":CodriverTasks scratch-buffer command"
  files = ["lua/codriver/tasks.lua", "lua/codriver/init.lua", "tests/codriver/tasks_spec.lua", "tests/nvim/tasks_check.lua"]
  description = ":CodriverTasks opens a read-only scratch buffer/float listing each active\ntask's id, title, status, and owner (via ownership.lua), closing on any\nkeypress. Calls dross.read() fresh on every invocation rather than caching\nfrom session start (c-4). When dross.read() reports unavailable — no active\nphase, or a corrupt plan.toml — notifies instead of opening a buffer or\nerroring (c-5).\n"
  covers = ["c-2", "c-3", "c-4", "c-5"]
  depends_on = ["t-2"]
  test_contract = ["render() re-reads dross.read() on every call — two calls straddling an on-disk plan.toml edit return different output", ":CodriverTasks with an active phase opens a scratch buffer with one line per task showing id, title, status, and owner", "pressing any key in the opened buffer closes it", "with no active phase or a corrupt plan.toml, :CodriverTasks notifies instead of opening a buffer or erroring"]
  status = "done"
