[[criterion]]
  id = "c-6"
  status = "weak"
  tests = ["tests/codriver/init_spec.lua:it('notifies on handover')", "tests/codriver/init_spec.lua:it('notifies on takeback')"]
  notes = "handover_command's notify (\"codriver: Claude is driving\") and takeback_command's notify (\"codriver: you're driving\") both contain the substring \"driving\", and _G.vim._notifications only resets in after_each (tests/busted_setup.lua), not between the two handler calls inside 'notifies on takeback'. That test calls CodriverHandover then CodriverTakeback and asserts only that the *last* notification contains \"driving\" — if takeback_command's notify() call were deleted entirely, last_notification() would still return the leftover handover message (\"Claude is driving\"), which still matches, so the test would not catch a takeback that fires no confirmation at all. 'notifies on handover' is solid in isolation (only one notification exists by that point)."

[[finding]]
  severity = "FLAG"
  text = "c-6: 'notifies on takeback' asserts last_notification():find('driving') — a substring both handover's and takeback's messages share — so it would not fail if takeback_command's notify() call were removed, since the preceding handover notification in the same test still matches. Tighten to assert on takeback's distinguishing text (e.g. \"you're driving\") or the exact message."

