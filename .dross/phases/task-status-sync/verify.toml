[[criterion]]
  id = "c-2"
  status = "weak"
  tests = ["tests/nvim/tasks_check.lua:9 (`d`/`u` — asserts vim.fn.getchar(1)==0, i.e. the float does not close)"]
  notes = "No test asserts the displayed buffer line actually changes to the new status after d/u. A regression that dropped the `rendered = M.render(); redraw()` calls from the d/u branch (while leaving no-close, argv, and notify behaviour intact) would pass every current assertion — the real-dross case in the same file checks plan.toml on disk, not the on-screen line, so it would not catch a stale display either."

[[criterion]]
  id = "c-3"
  status = "weak"
  tests = ["tests/nvim/tasks_check.lua:10 (failed write notifies at ERROR with the failure message)", "tests/nvim/tasks_check.lua:11 (spawn failure notifies without crashing)"]
  notes = "The \"surfaces the failure\" half is solidly covered by the ERROR-level vim.notify assertions. The \"does not leave the UI showing a status that was never persisted\" half is true by construction (open() never mutates a local status field; it always re-renders from disk) but is not independently asserted — the same hypothetical redraw()-removal regression noted under c-2 would also slip past this half undetected."

[[criterion]]
  id = "c-4"
  status = "covered"
  tests = ["tests/nvim/tasks_check.lua:9 (`u` on the cursor task calls task_status.set with status \"in_progress\", from the same key-loop surface as `d`)"]

