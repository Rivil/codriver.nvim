  text = "c-2: no test asserts the float's displayed line actually updates to the new status after d/u — only that it stays open. Add a check spying on tasks._show/redraw (mirroring step 7's shown_lines spy) that presses d/u and asserts the visible line reflects the new status before the trailing q closes it."

