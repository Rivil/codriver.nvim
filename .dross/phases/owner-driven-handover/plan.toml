[phase]
id = "owner-driven-handover"

[[task]]
id            = "t-1"
wave          = 1
title         = "u-key drives role from task ownership"
files         = ["lua/codriver/tasks.lua", "tests/nvim/tasks_check.lua"]
description   = """
Split open()'s combined `d`/`u` branch in the key loop. `d` keeps its current
code path exactly as-is — it never looks at ownership or role (c-3).

For `u`: after task_status.set(phase_id, task_id, "in_progress") returns
ok=true, look up ownership.owner(phase_id, task_id) (require("codriver.role")
alongside the existing task_status require) and compute the expected role —
ownership.CLAUDE -> "driver", ownership.HUMAN -> "navigator". If that differs
from role.get(), call role.set(expected) and vim.notify the exact same message
:CodriverHandover/:CodriverTakeback already use ("codriver: Claude is driving"
/ "codriver: you're driving") — reusing that text is what satisfies c-5's
"same feedback guarantee" requirement rather than inventing new copy.

If task_status.set's write fails (ok=false), no role lookup or switch is
attempted at all — the task didn't actually transition, so flipping role would
describe a state that isn't true on disk. If the owner already matches the
current role, role.set() is not called and no role-switch notification fires
(role.set() itself already no-ops on no-change; this task's own notify call
must independently be gated on the same difference check, not fire
unconditionally after every successful `u`).

No confirmation prompt for the switch (locked switch_mechanism decision) and
no special-casing for a second in_progress task under the opposite owner
(locked concurrent_tasks decision) — the just-started task's owner always
wins.
"""
covers        = ["c-1", "c-2", "c-3", "c-4", "c-5"]
test_contract = [
  "pressing `u` on a claude-owned task while role is navigator flips role.get() to \"driver\" and notifies \"codriver: Claude is driving\"",
  "pressing `u` on a human-owned task while role is driver flips role.get() to \"navigator\" and notifies \"codriver: you're driving\"",
  "pressing `u` on a task whose owner already matches the current role leaves role.get() unchanged and fires no role-switch notification",
  "pressing `d` on a claude-owned task while role is navigator leaves role.get() as \"navigator\" — d never drives a role switch",
  "pressing `d` on a human-owned task while role is driver leaves role.get() as \"driver\"",
  "when task_status.set for a `u` press returns ok=false, role.get() is unchanged — a failed write must not flip the role",
]
status        = "pending"
