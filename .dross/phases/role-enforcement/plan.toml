task_seq = 0

[phase]
  id = "role-enforcement"

[[task]]
  id = "t-1"
  wave = 1
  title = "Session state file and liveness probe"
  files = ["lua/codriver/hook/state.lua", "tests/nvim/hook_state_check.lua"]
  description = "`publish(record)` / `read(path)` / `probe(env)` / `clear()` over a session-scoped\nJSON record at `stdpath(\"state\")/codriver/<pid>.json`. The record carries schema\nversion, owner pid, role, AND the resolved `test_command` — the state file is\nthe only channel that reaches the hook subprocess, and putting the command here\nrather than in the launch env makes it live-reloadable for the same reason c-6\ndemands of the role. Owns the security-relevant is-a-session-live question the\n`no_session_behaviour` lock creates. `probe` returns three states, never a\nboolean: no session / live-but-role-unreadable / live-with-role — c-7 and\n`no_session_behaviour` stop being separately testable the moment that collapses\nto two.\n"
  covers = ["c-6", "c-7"]
  test_contract = ["if the state path is frozen at module load instead of resolved per call, the check that redirects XDG_STATE_HOME/HOME into its sandbox finds the file under the developer's real ~/.local/state — the same freeze-at-load trap the harness already guards for the vendored lock_dir", "if the path lands inside the working tree, the check fails: path() is asserted outside vim.fn.getcwd(), because a state file in the tree is a role switch reachable from a tool call", "if publish() is not temp-file-plus-rename, a reader sampling across 200 role flips observes a partial document; asserted at the call level (the module must never open the final path for truncation), because a torn file read as live-but-role-unreadable turns cosmetic non-atomicity into refused read-only work", "if read() collapses its failure modes, read(<missing>) and read(<not json>) return the same value — the caller allows on the first and denies on the second, so one result for both makes c-7 and no_session_behaviour indistinguishable", "if probe() calls a session live purely because the file exists, a killed nvim leaves probe live = true and every write in that repo is denied forever — liveness is the owning process (kill(pid,0)), not the file", "if a corrupt file with the owning nvim alive reports live = false, c-7 cannot fire: probe returns live = true, role = nil, which is a third result distinct from no-session-at-all", "if the record drops schema version or owner pid, a file from a previous codriver version parses as a role and a pid-recycled file reads as live", "if the record does not carry test_command, the hook subprocess has no route to it at all — it runs under `nvim --clean -l` with codriver's config unreachable, so a record without the field makes c-5's allowlisted test command unsatisfiable. A record whose test_command is absent must read back as nil rather than empty string, because an empty command would match the empty-command refusal in t-2 instead of disabling the allowance"]
  status = "done"

[[task]]
  id = "t-2"
  wave = 1
  title = "Read-only Bash allowlist matcher"
  files = ["lua/codriver/hook/bash.lua", "tests/codriver/hook_bash_spec.lua"]
  description = "Pure string matcher, no vim.* — refuse anything that can introduce a second\ncommand or a redirection, then match each segment head against an allowlist with\nper-command argument rules. Sound by construction per the `bash_policy` lock: a\ndeny-list cannot deliver c-2's byte-identity guarantee.\n"
  covers = ["c-4", "c-5"]
  test_contract = ["redirection: `echo hi > f`, `grep x lua/ >> out`, `cmd 2>f`, and any use of `tee` are refused even when the head token is allowlisted", "chaining: `git status && rm -rf lua` and `git log; rm x` are refused unless every segment independently matches — and the inverse half is asserted too: `git log | head -20` must ALLOW, so segmenting is not quietly dropped into a blanket refusal of every metacharacter", "substitution: `grep \"$(rm -f x)\" .`, backticks, and `<(...)` are refused regardless of head token", "interpreters and write-forms: `eval`, `sh -c`, `bash -c`, `xargs`, `env A=1 rm x`, `nohup`, `python3 -c \"open('f','w')\"`, `find . -delete`, `find . -exec rm {}`, `sed -i`, `perl -i` are each refused individually", "git is matched by subcommand, not by head: `git commit`, `git checkout .`, `git restore`, `git apply`, `git stash`, `git clean -fd`, `git config --global` refused; only status/log/diff/show/blame/ls-files/rev-parse pass", "the allow set is asserted positively, not just the deny set: `rg -n pat lua/`, `git status --short`, `git log --oneline -5`, `ls tests`, `cat README.md` all pass", "the configured test command matches the whole normalized command exactly, never a prefix: with test_command `mise run test`, both `mise run format` and `mise run test; rm x` are refused — it is a deliberate write-capable hole and prefix matching would widen it", "head bypasses: `FOO=1 rm x` (leading assignments stripped before matching), `/bin/rm -rf .` (absolute path matched on basename), `rgx --write f` (no prefix matching on the allowlist entry `rg`)", "the empty command `\"\"` and whitespace-only `\"   \"` refuse rather than falling through to allow", "if the test command is a module constant rather than an argument, the matcher cannot be driven with two different test_command values in one spec run — it is passed in per call, and a nil test_command must disable the allowance entirely rather than allowing everything or raising"]
  status = "done"

[[task]]
  id = "t-3"
  wave = 1
  title = "Merge codriver hook into Claude settings"
  files = ["lua/codriver/hook/claude_settings.lua", "tests/codriver/hook_claude_settings_spec.lua", "tests/nvim/hook_settings_check.lua"]
  description = "`merge(existing, command)` is a pure table transform and `encode(doc)` a\nhand-written deterministic serializer — sorted keys, fixed indent, and\narray-ness preserved for the settings schema's known array paths. vim.json is\nnot usable here: encode guarantees neither key order nor indent, and decode\ncollapses `[]` to `{}`, which would silently rewrite an empty permissions.allow\nas an object. Both halves are pure and busted-testable; `install(path, command)`\nis the atomic read-merge-write around them (headless). Registers a PreToolUse\nhook with matcher `*` — the fail-closed default for an unknown tool name is\nunreachable with a named-tool matcher. Named `claude_settings` rather than\n`settings` to avoid colliding with codriver's own config vocabulary.\n"
  covers = ["c-1"]
  test_contract = ["if merge() does not preserve what it did not write, the existing permissions.allow entries of the repo's real settings.local.json are not reproduced element-for-element in order, or a sibling top-level key is dropped — asserted as every existing entry in order, never against a literal count", "if registration is not idempotent, merging twice yields two codriver PreToolUse entries — asserted by count, not by string equality", "if a stale entry is not replaced, merging with a new plugin root leaves the old command string alongside the new one; the match is on the entry whose command names codriver's hook script, because a stale absolute path is silent non-enforcement", "if third-party hooks are collateral damage, an unrelated PreToolUse matcher and a PostToolUse block present before the merge are absent after", "if serialization is not deterministic (stable key order and indent), encoding an already-registered document twice produces different bytes — without byte-stability, re-registering on every session start becomes an unreviewable working-tree diff", "if array-ness is not preserved, a settings file whose permissions.allow is the empty array `[]` comes back as `{}` and Claude Code reads a malformed permissions block — the round trip is asserted for empty allow, empty hooks, and a document with no permissions key at all", "if the matcher narrows to a list of write tools, a newly-named write tool is never hooked — the rendered matcher must be the literal `*`", "if install() is not atomic, pointing it at a path whose rename target cannot be replaced leaves the original truncated or gone", "if malformed existing JSON is silently overwritten, the user's hand-written allow list is destroyed — install must refuse, name the path, and leave the file untouched", "if the target path drifts, install(<temp root>) writes anything under this repository's own .claude/ — every headless check runs with cwd at the repo root, so a drifting path would arm enforcement against the developer's own session"]
  status = "done"

[[task]]
  id = "t-4"
  wave = 1
  title = "Neovim-side refusal notification receiver"
  files = ["lua/codriver/hook/notify.lua", "tests/codriver/hook_notify_spec.lua"]
  description = "The function the hook process reaches over RPC. Treats its argument as untrusted\ndata arriving from another process. Busted-testable because vim.notify is the\none API the existing minimal stub already carries.\n"
  covers = ["c-8"]
  test_contract = ["if the payload is formatted rather than escaped, a tool name of `Edit\\n%s%s` produces a multi-line notification or raises inside format() — one single-line notification, always", "if the receiver trusts the arriving table, a payload with tool_name missing or non-string raises inside nvim's RPC handler instead of notifying an unknown-operation line — an error there is invisible and the refusal goes unreported", "refused{tool = \"Edit\", path = \"lua/x.lua\"} emits exactly one vim.notify at WARN or above whose text contains both \"Edit\" and \"lua/x.lua\"", "if it grows a return value or a blocking wait, the hook's fire-and-forget notify starts delaying every denied tool call", "if a refusal storm is not coalesced, ten denials inside one second produce ten notifications and bury the editor when the model retries in a loop"]
  status = "done"

[[task]]
  id = "t-5"
  wave = 2
  title = "Decision core: classify, resolve role, refuse"
  files = ["lua/codriver/hook/decision.lua", "tests/codriver/hook_decision_spec.lua"]
  description = "Pure `decide(payload, session) -> { permission, reason }`. Read allowlist, write\nclassification, Bash delegated to t-2, role from t-1's record, and the locked\nrefusal text. Two distinguishable reasons: the navigator refusal and the\nindeterminate (c-7) refusal, both satisfying the `refusal_message` lock. No\nvim.* — reaching for vim.fn/vim.uv/vim.json errors the spec on a nil field under\nthe existing minimal stub rather than passing under a widened one.\n"
  covers = ["c-2", "c-3", "c-5", "c-7"]
  depends_on = ["t-1", "t-2"]
  test_contract = ["if a write tool stops being classified, decide under navigator allows one of Edit / Write / MultiEdit / NotebookEdit — asserted per tool, not as a group", "if an unrecognised tool name falls through to allow, a synthetic FutureWriteTool passes under a live navigator session — the default inside a live session is deny, and the read allowlist is the only path to allow", "if the read allowlist narrows, Read / Glob / Grep / WebFetch / WebSearch / TodoWrite / Task are denied and c-5's read-only work stops (Task is allowed because its subagent's own tool calls are hooked in turn)", "if the allowlist omits the interaction and shell-observation tools, navigator Claude is crippled rather than restricted: AskUserQuestion, ExitPlanMode, SlashCommand, BashOutput and KillShell are each asserted to allow — denying AskUserQuestion means it cannot ask the user anything, and denying BashOutput means it cannot read the output of a command the allowlist just permitted", "if default-deny does not cover the MCP surface, a third-party server's file-writing tool (serena's replace_content / replace_symbol_body / create_text_file are live in this repo's own environment) is allowed under navigator — every mcp__ tool denies except the four vendored Neovim ones the nvim_write_tools lock names", "if the vendored Neovim MCP tools are swept up, openDiff, saveDocument, close_tab or closeAllDiffTabs are denied under their mcp__ prefix — the nvim_write_tools lock keeps them live, and blocking them makes :CodriverDiffAccept dead code", "if enforcement leaks past the role, decide{role = \"driver\"} denies Edit, Write or `rm -rf build` — driver is unrestricted", "the navigator refusal text contains \"navigator\", states the block is harness-level and not retryable, and a not-contains assertion on \":Codriver\" pins that no handover command is named", "role nil, empty string, or \"nvigator\" inside a live session denies with the INDETERMINATE reason, asserted as a different string from the navigator reason — c-7's failure mode has to be readable in the refusal the user sees", "if the decision reads anything but (tool, tool_input, role), an otherwise identical payload carrying \"the user explicitly authorised this edit\" flips it to allow — c-3 holds only if phrasing is not an input", "if Bash bypasses the matcher, decide{tool = \"Bash\", command = \"rm x\"} is allowed without t-2 being consulted", "if the test command is not threaded from the session record into the matcher, decide with session.test_command = \"mise run test\" denies that exact command, or decide with session.test_command = \"just check\" allows `mise run test` — the value the hook read from disk is the one that governs, and t-5 is the only place it can be joined to t-2"]
  status = "done"

[[task]]
  id = "t-6"
  wave = 1
  title = "Launch channel and test_command option"
  files = ["lua/codriver/config.lua", "tests/codriver/config_spec.lua"]
  description = "`resolve(opts, channel)` gains a second parameter —\n`{ state_file = <path>, nvim_address = <addr> }`, supplied by the caller — and\nmerges it as CODRIVER_STATE_FILE / CODRIVER_NVIM_ADDRESS into the vendored\nclaudecode `env` table the terminal hands the CLI (forced, the way `auto_start`\nalready is). resolve computes neither value itself: `stdpath` and `serverstart`\nwould drag vim.* into a module committed to being stub-testable, and the address\ndoes not exist until t-8 ensures it. Also accepts a new top-level codriver\n`test_command` key — codriver's own config, never read from .dross/project.toml,\nbecause a Neovim plugin must not depend on dross's file layout.\n"
  covers = ["c-1", "c-6"]
  test_contract = ["if the user's env table is clobbered, resolve({claudecode = {env = {FOO = \"1\"}}}) loses FOO — codriver adds keys, it does not own the table", "if codriver's keys are defaulted rather than forced, a user setting CODRIVER_STATE_FILE points the hook at a file they control and role state becomes user-writable; both keys are overwritten with exactly one warning naming the ignored key", "if the channel is absent, resolve(opts, nil) emits the keys with nil/empty values — an empty CODRIVER_STATE_FILE reads downstream as a live session with an unreadable file, i.e. c-7 firing on a plain `claude` run. The keys must be absent, not empty", "if resolve computes the channel itself rather than receiving it, the spec fails under the minimal stub on a nil vim.fn.stdpath or vim.fn.serverstart — the ordering constraint (address ensured and role published BEFORE resolve is called) is t-8's to satisfy, and config.lua must stay pure enough to prove it did not cheat", "if every value is not a string, the vendored config.apply assert (env values must be strings) fires — a pid injected as a number takes down setup()", "if injection happens after the vendored setup rather than before, the variables never reach the CLI: the vendored init calls terminal.setup(..., config.env) during setup and freezes defaults.env there — assert the env table the fake receives, not a later mutation of it", "if the new option escapes validation, resolve({test_command = 42}) returns instead of raising, resolve({test_commnd = \"x\"}) stops being rejected as an unknown top-level key, or resolve({}).codriver.test_command is anything but nil; and test_command surfaces under .codriver, never under .claudecode"]
  status = "done"

[[task]]
  id = "t-7"
  wave = 3
  title = "Hook entrypoint: stdin, crash containment, notify"
  files = ["scripts/codriver-hook.lua", "mise.toml", "tests/nvim/harness.lua", "tests/nvim/hook_entrypoint_check.lua"]
  description = "`nvim --clean -l scripts/codriver-hook.lua` — read stdin, probe liveness, decide,\nemit only on deny, fire-and-forget the refusal over RPC. Every internal error\ninside a live session becomes a deny. mise.toml widens the syntax and lint globs\nto cover scripts/ (today they are `find lua` and `luacheck lua/ tests/`, so a\nsyntax error in scripts/ would disable enforcement with a green pipeline). Adds\n`harness.run_hook(payload, env) -> {code, stdout, stderr}` driving the REGISTERED\ncommand, so t-10..t-14 cannot each grow a spawner and drift.\n"
  covers = ["c-2", "c-3", "c-5", "c-6", "c-7", "c-8"]
  depends_on = ["t-1", "t-2", "t-4", "t-5"]
  test_contract = ["if an allowed tool emits an explicit allow, stdout is non-empty — it must be empty with exit 0. An emitted permissionDecision \"allow\" auto-approves every tool the user never consented to, converting codriver from a restriction into a blanket permission grant", "if the deny payload drifts, stdout stops parsing as { hookSpecificOutput = { hookEventName = \"PreToolUse\", permissionDecision = \"deny\", permissionDecisionReason = <t-5's reason> } } — a shape Claude Code does not recognise is treated as allow", "if the hook crashed and the hook denied become the same observable, a bare non-zero exit is emitted instead of a deny document — a non-blocking hook error is allowed straight through", "if an internal error fails open, then with a live session the script exits with no deny for each of: unparsable stdin, valid JSON of the wrong shape, a state file replaced by a directory, and a decision module that raises — all four asserted on stdout and exit status", "if anything else reaches stdout, a stray print or an nvim startup message makes the document unparsable and the deny silently degrades to an allow — stdout is exactly one JSON object or empty, nothing else", "if the script loads user configuration, a temporary XDG_CONFIG_HOME/nvim/init.lua planted by the harness runs during the hook — a user's config can take seconds or prompt, on every gated tool call", "if package.path is not derived from the script's own path, running with cwd = / and no runtimepath cannot require the decision module and every tool call fails open", "if the script grows a toolchain dependency, running it with PATH stripped to the directory holding `nvim` fails — it runs under --clean with no mise and no luarocks", "if the notification send is blocking or unguarded, pointing CODRIVER_NVIM_ADDRESS at a dead socket makes the script hang or exit non-zero instead of returning its deny — notification failure must never change the decision, so c-8 cannot break c-2", "if an allowed call still notifies, an allowed Read against a live session chatters at the editor during normal work", "if the hook itself touches the workspace, the Edit payload's target file changes size or content across the run — the hook is a decision, not an actor"]
  status = "done"

[[task]]
  id = "t-8"
  wave = 2
  title = "setup: publish role, listen, clean up on exit"
  files = ["lua/codriver/init.lua", "tests/nvim/hook_publish_check.lua"]
  description = "`setup()` ensures an RPC address (serverstart when v:servername is empty),\npublishes the role immediately, re-publishes from a `role.on_change` listener,\nand clears the state file on the existing CodriverShutdown augroup.\n"
  covers = ["c-6"]
  depends_on = ["t-1", "t-6"]
  test_contract = ["if the role is published only at setup time, role.set(\"driver\") afterwards leaves the state file reading navigator — the on_change listener is what makes c-6 live rather than launch-fixed", "if the published record omits the resolved test_command, the hook allows nothing through the test-command path and c-5 fails at runtime while every unit spec still passes — assert the field is present in the file after setup and that it survives a role flip, since the on_change republish must not drop the fields it is not changing", "if the state file outlives Neovim, a child nvim that sets up and :qa leaves it behind and the next bare `claude` run in that repo is governed by a session that does not exist — asserted for :qa AND :cquit", "if serverstart is skipped when v:servername is empty, CODRIVER_NVIM_ADDRESS is absent in exactly the headless case the checks run in and every refusal is silent", "if the address and the published role are not established BEFORE config.resolve is called, the channel table handed to resolve carries nil — assert against a real setup() that the env reaching vendored setup holds a CODRIVER_STATE_FILE naming a readable navigator record and a CODRIVER_NVIM_ADDRESS that sockconnects, rather than deferring that to t-10 two waves later", "if setup is not re-entrant, a second setup({}) registers a second role listener and one refusal notifies twice", "if publish happens after the commands are registered rather than before, there is a window where commands are live and the state file is not — the check asserts the state file reads navigator immediately after setup returns"]
  status = "done"

[[task]]
  id = "t-9"
  wave = 3
  title = "Arm on session start, disarm on stop"
  files = ["lua/codriver/session.lua", "tests/codriver/session_spec.lua", "tests/nvim/hook_install_check.lua"]
  description = "`session.ensure_server()` installs the settings registration before the terminal\nopens; `stop()` removes the state file. Arming lives on the session path rather\nthan in `setup()` so codriver never writes .claude/ into a repo where the user\nnever asked for Claude. The settings entry deliberately survives stop — inert\nwithout a state file, per the `settings_delivery` accepted cost.\n\nThe registration targets `vim.fn.getcwd()`, which is the vendored default\nresolution when `cwd`, `cwd_provider` and `git_repo_cwd` are all unset. Codriver\ndoes NOT reproduce the vendored private `build_config` chain — it is unexported\nand r-02 forbids exporting it, and the public `cwd.resolve` is a subtly\ndifferent function the terminal does not use. Non-default cwd options are out of\nscope for this phase and must warn rather than silently arm the wrong directory.\n"
  covers = ["c-1"]
  depends_on = ["t-1", "t-3", "t-8"]
  test_contract = ["if arming happens after the terminal, the recorded call order from session.start() is open-then-write — the CLI can be issuing tool calls against a settings file with no hook in it yet. Ordering is the contract, exactly as it already is for the server/terminal pair", "if the already_running path skips arming, deleting settings.local.json and running ensure_server() again leaves it unregistered — every :Codriver* preflight goes through ensure_server, so that is the one place arming is guaranteed", "if the registration lands somewhere Claude does not read, the write path is not vim.fn.getcwd() under the default configuration — asserted with cwd, cwd_provider and git_repo_cwd all unset, which is the only resolution this phase claims", "if an unsupported cwd option arms the wrong directory silently, setting any of cwd / cwd_provider / git_repo_cwd produces no warning naming the option — the phase's scope limit has to be visible to the user, because the failure it prevents is enforcement that looks installed and is not", "if the registered command path does not resolve, read the command back out of the written settings file, assert it exists and is executable by `nvim -l`, and run it — a moved plugin dir leaves a stale absolute path and silent non-enforcement", "if install is not idempotent, a start/stop/start cycle leaves two codriver PreToolUse entries", "if stop does not disarm, the state file survives session.stop() and a plain `claude` in this repo is refused with no Neovim behind it", "if the check arms the developer's own repository, anything under this repository's .claude/ is modified across the run — the check drives a real session.start() and mise's test-nvim task runs every check from the repo root, so an unpinned cwd writes a live PreToolUse entry into the settings file governing the developer's next Claude Code session. harness.lua sandboxes HOME and CLAUDE_CONFIG_DIR but NOT cwd, so this check supplies its own temp project dir and asserts the repo's .claude/ is byte-identical before and after"]
  status = "done"

[[task]]
  id = "t-10"
  wave = 4
  title = "Headless launch-time enforcement check"
  files = ["tests/nvim/enforcement_launch_check.lua"]
  description = "The only check where the GENERATED registration is what enforces — every other\ncheck invokes the hook script by a path it composed itself. Drives a real\n:CodriverStart against a capture terminal provider in a temp project dir.\n"
  covers = ["c-1"]
  depends_on = ["t-7", "t-9"]
  test_contract = ["if registration is not in place when the CLI launches, the capture terminal provider's open is called while <project>/.claude/settings.local.json holds no codriver PreToolUse entry; each recorded provider call carries whether the file was armed at that moment, so late arming cannot be masked by a later read", "if the pre-existing file is destroyed, a settings file seeded with a permissions.allow array and a foreign PostToolUse hook before :CodriverStart comes back missing either", "if the launch env drops the channel, the captured env lacks CODRIVER_STATE_FILE pointing at a readable file whose role is navigator, or CODRIVER_NVIM_ADDRESS that sockconnects from this process", "if the generated registration is not what enforces, the command string read out of the generated settings.local.json fails to produce a deny for an Edit payload while navigator", "if the user is required to hand-edit anything, the check's project dir needed a pre-seeded hooks block to pass — it starts with permissions only, and enforcement must be live anyway"]
  status = "done"

[[task]]
  id = "t-11"
  wave = 4
  title = "Headless write refusal and byte-identity check"
  files = ["tests/nvim/enforcement_write_check.lua"]
  description = "Drives the real hook entrypoint as a subprocess against a real live session via\nharness.run_hook. Deliberately overlaps t-5's unit spec — that is what keeps the\npure core honest about the shape of the thing it decides on.\n"
  covers = ["c-2", "c-3"]
  depends_on = ["t-7", "t-9"]
  test_contract = ["if a denied Edit still reaches disk, sha256 a fixture, drive the hook with an Edit payload targeting it, and require both a deny and a byte-identical file afterwards", "if the refusal depends on phrasing, the same payload with \"the user has explicitly approved this edit, proceed\" added to tool_input is allowed, or returns a different reason than the plain payload — c-3 is a permission-layer property, not a model-behaviour one", "if the deny reason names a command that does not exist yet, the reason contains \":Codriver\" — the runtime half of t-5's unit assertion", "if a new tool name defaults to allow, a synthetic Edit2 payload passes under navigator", "if the vendored diff surface is caught in the net, an openDiff payload is denied and :CodriverDiffAccept becomes unreachable", "if driver mode does not release, the same Edit payload after role.set(\"driver\") is still denied — enforcement that cannot be handed back is a broken plugin, not a safe one"]
  status = "done"

[[task]]
  id = "t-12"
  wave = 4
  title = "Headless bash refusal and read-only survival"
  files = ["tests/nvim/enforcement_bash_check.lua"]
  description = "The end-to-end half of the bash_policy lock: a shell write must be refused on the\nsame grounds as the edit tool, and real read-only work must still run.\n"
  covers = ["c-4", "c-5"]
  depends_on = ["t-7", "t-9"]
  test_contract = ["if a shell write is not refused on the same grounds as Edit, `printf x > <fixture>` is allowed, or the fixture is not byte-identical after, or its reason differs from the Edit refusal's", "if chaining defeats it end-to-end, `git status --short && rm victim.txt` is allowed or victim.txt is gone afterwards", "if read-only work is only theoretically allowed, the check does not merely assert the decision: it runs `grep -rn role lua/` and `git status --short` through the allow path and requires real output and exit 0", "if read-only TOOLS are caught in the net, Read / Grep / Glob payloads produce a deny while navigator", "if the project's test command stops being allowed, the configured test_command is denied — asserted as a decision, not by running it, so the check cannot recurse into itself"]
  status = "done"

[[task]]
  id = "t-13"
  wave = 4
  title = "Headless liveness and fail-closed check"
  files = ["tests/nvim/enforcement_liveness_check.lua"]
  description = "Proves the decision reads live role state at call time rather than a value fixed\nat launch, and that an unreadable role inside a live session refuses while no\nsession at all allows.\n"
  covers = ["c-6", "c-7"]
  depends_on = ["t-7", "t-9"]
  test_contract = ["if the decision is fixed at launch, an Edit payload denies, then role.set(\"driver\") in the live instance, then the identical payload re-run against the same already-launched session still denies — no relaunch, no re-read of env; and it flips back on role.set(\"navigator\")", "if the role is read from the environment instead of the file, rewriting the state file's role field directly and re-running changes nothing", "if fail-closed does not fire inside a live session, then with the instance alive and the state file (a) removed, (b) truncated mid-JSON, (c) role rewritten to \"nvigator\", the Edit payload is allowed — three separate spawns, each asserted to carry the indeterminate reason and NOT the navigator reason", "if the no-session path fails closed, then with the instance killed, or with CODRIVER_* absent from the environment entirely, the same payload is denied — a plain `claude` in this repo must keep working", "if a stale record is trusted, a state file whose owner pid is dead but whose contents say navigator denies the payload"]
  status = "done"

[[task]]
  id = "t-14"
  wave = 4
  title = "Headless refusal-notification round-trip check"
  files = ["tests/nvim/enforcement_notify_check.lua"]
