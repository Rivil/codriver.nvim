[[criterion]]
  id = "c-1"
  status = "covered"
  tests = ["tests/nvim/session_lifecycle_check.lua:107 (start names its port)", "tests/nvim/session_lifecycle_check.lua:130 (a second start reports the live session, not an error)", "tests/codriver/init_spec.lua:437 (reports a second start as the session it already has)", "tests/codriver/session_spec.lua:154 (reports an existing session without calling the vendored start)"]
  notes = "Asserts the start output contains the bound port, that a second :CodriverStart keeps the same port, writes no second lockfile, says \"already\", and is not notified at ERROR level. A failed bind is separately proven to leave no lockfile."

[[criterion]]
  id = "c-2"
  status = "covered"
  tests = ["tests/nvim/terminal_env_check.lua:102 (expect_launch_env: CLAUDE_CODE_SSE_PORT, ENABLE_IDE_INTEGRATION, FORCE_CODE_TERMINAL, no_proxy loopback, cmd token \"claude\")", "tests/nvim/terminal_env_check.lua:158 (server listening at the moment the terminal is opened)", "tests/nvim/terminal_env_check.lua:182 (no wrapper module assigns CLAUDE_CODE_SSE_PORT itself)", "tests/codriver/session_spec.lua:168 (brings the server up before opening the terminal)"]
  notes = "Each recorded provider call carries whether the server was listening at the moment it was made, so terminal-before-server is caught rather than masked by a later port value. The user-sets-nothing half is proven by asserting the env table handed to the provider, plus a source scan forbidding a second assignment site."

[[criterion]]
  id = "c-3"
  status = "covered"
  tests = ["tests/nvim/mcp_context_check.lua:178 (getCurrentSelection returns the unsaved buffer line and not the on-disk line)", "tests/nvim/mcp_context_check.lua:163 (checkDocumentDirty flips false->true->false around an unwritten edit)", "tests/nvim/mcp_context_check.lua:125 (tools/list offers every context tool Claude asks for)"]
  notes = "Driven through the real server.state.handlers[\"tools/call\"] dispatcher against a stub client, and through a real V/<Esc> visual selection so the vendored ModeChanged flush is the path exercised. expect_not_contains(DISK_LINE) is what makes a stale-file read fail rather than pass."

[[criterion]]
  id = "c-4"
  status = "covered"
  tests = ["tests/nvim/status_check.lua:109 (listening names the port and says \"waiting for Claude\", never \"Claude attached\")", "tests/nvim/status_check.lua:113 (attached says so and no longer reads as waiting)", "tests/nvim/status_check.lua:124 (checkhealth codriver reports port, lockfile path and client count)", "tests/codriver/session_spec.lua:301 (never reads a bare client count as Claude)", "tests/codriver/session_spec.lua:324 (does not accept a client that only claims to be connected)", "tests/codriver/status_spec.lua:36 (the listening line does not read as connected)"]
  notes = "Both directions asserted with expect_not_contains, so a formatter that collapsed the two states fails rather than passing on a substring. The two obvious cheats — inferring connected from a TCP client count, or from a client that merely claims it — are killed explicitly in session_spec."

[[criterion]]
  id = "c-5"
  status = "covered"
  tests = ["tests/nvim/session_lifecycle_check.lua:145 (stop: server down, named lockfile gone, lock dir empty, selection autocmds cleared)", "tests/nvim/session_lifecycle_check.lua:157 (a start after a stop comes back up, names its port, one lockfile named for the new port)", "tests/codriver/session_spec.lua:282 (lets a fresh start follow a stop)"]
  notes = "The restart is asserted against the real server in the same process, which is what makes an incomplete stop observable. Idle stop is separately proven to say \"no session\" at non-ERROR level and to leave the lock dir untouched."

[[criterion]]
  id = "c-6"
  status = "covered"
  tests = ["tests/nvim/coexistence_check.lua:85 (require(\"claudecode\") resolves to the fixture, not to the vendored table)", "tests/nvim/coexistence_check.lua:109 (codriver.setup leaves the :ClaudeCode* command surface byte-identical, and the fixture handler still runs afterwards)", "tests/nvim/coexistence_check.lua:133 (the fixture keeps its ClaudeCodeShutdown autocmd; codriver has its own CodriverShutdown)", "tests/nvim/coexistence_check.lua:148 (no vendored file answers :checkhealth claudecode)", "tests/nvim/coexistence_check.lua:170 (codriver still starts and stops cleanly with the rival loaded)"]
  notes = "A real fixture plugin is prepended to runtimepath so it wins any contested resolution, and each of the four collision surfaces carries a marker. The checkhealth assertion guards against passing vacuously by first requiring the glob to match something."

[[criterion]]
  id = "c-7"
  status = "covered"
  tests = ["tests/nvim/command_surface_check.lua:69 (every vendored command captured from the real registration has a :Codriver* name and is registered)", "tests/nvim/command_surface_check.lua:106 (range/nargs/bang/complete preserved per command, normalised on both sides)", "tests/nvim/command_surface_check.lua:139 (CodriverAdd and '<,'>CodriverSend put real entries in the vendored mention queue)", "tests/nvim/command_surface_check.lua:166 (CodriverDiffAccept and CodriverSelectModel complete rather than raise)", "tests/codriver/commands_spec.lua:173 (the rename map covers every vendored command and nothing else)"]
  notes = "Drift is checked against commands.capture(vendor._create_commands) rather than a hand-written list, so an upstream re-sync that adds or renames a command fails here. Handlers pass through register() by reference in one loop, so the four behavioural spot-checks exercise the mechanism all fifteen share."

[[criterion]]
  id = "c-8"
  status = "covered"
  tests = ["tests/nvim/autostart_off_check.lua:21 (setup({}) leaves nothing listening, no lockfile, snapshot false, commands still registered)", "tests/nvim/autostart_on_check.lua:50 (auto_start = true opens a session at launch, one lockfile named for the port)", "tests/nvim/autostart_on_check.lua:100 (a child nvim that auto-starts and quits gives its lockfile back on exit)", "tests/codriver/config_spec.lua:72 (forces the vendored auto_start off even when set)", "tests/codriver/config_spec.lua:83 (does not forward the codriver opt-in down to the vendored layer)"]
  notes = "Each half runs in its own process, because \"never started\" is not recoverable once something has. The child-nvim exit path is what proves the ClaudeCodeShutdown -> CodriverShutdown rename did not silently become a re-create."

