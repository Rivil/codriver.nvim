# StyLua configuration — kept identical to coder/claudecode.nvim so that
# wrapper code and vendored code share one formatting dialect. See VENDOR.md.

column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"

[sort_requires]
enabled = true
